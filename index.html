<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS — Command System</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

<canvas id="star-canvas"></canvas>
<div class="scanlines"></div>
<div class="grid-overlay"></div>
<div id="cursor"><div id="c-ring"></div><div id="c-dot"></div></div>
<div id="toast"></div>

<!-- ═══ EDIT TASK MODAL ═══ -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('edit-modal')">✕</button>
    <h3>⬡ Edit Mission</h3>
    <div style="margin-bottom:12px">
      <label style="font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:2px;color:var(--text2);display:block;margin-bottom:6px;text-transform:uppercase">TASK TEXT</label>
      <input class="input-field w-full" type="text" id="et-text" placeholder="Task description…"/>
    </div>
    <div class="form-inline">
      <select class="input-field" id="et-cat">
        <option value="general">⬡ General</option>
        <option value="work">⬡ Work</option>
        <option value="personal">⬡ Personal</option>
        <option value="health">⬡ Health</option>
        <option value="urgent">⬡ Urgent</option>
      </select>
      <select class="input-field" id="et-pri">
        <option value="medium">◈ Medium</option>
        <option value="high">◈ High</option>
        <option value="low">◈ Low</option>
      </select>
      <input type="date" class="input-field" id="et-due"/>
    </div>
    <div class="modal-actions">
      <button class="btn-sm btn-outline" onclick="closeModal('edit-modal')">CANCEL</button>
      <button class="btn-sm btn-info" onclick="saveTaskEdit()">SAVE MISSION</button>
    </div>
  </div>
</div>

<!-- ═══ VIEW USER TASKS MODAL ═══ -->
<div class="modal-overlay" id="user-tasks-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('user-tasks-modal')">✕</button>
    <h3 id="utm-title">⬡ Agent Tasks</h3>
    <div id="utm-body"></div>
  </div>
</div>

<!-- ═══ SEND NOTIFICATION MODAL ═══ -->
<div class="modal-overlay" id="notif-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('notif-modal')">✕</button>
    <h3>📡 Broadcast Message</h3>
    <div style="margin-bottom:12px">
      <label style="font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:2px;color:var(--text2);display:block;margin-bottom:6px">RECIPIENT</label>
      <input class="input-field w-full" type="text" id="nm-to" readonly style="opacity:.6"/>
    </div>
    <div style="margin-bottom:12px">
      <label style="font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:2px;color:var(--text2);display:block;margin-bottom:6px">SUBJECT</label>
      <input class="input-field w-full" type="text" id="nm-subject" placeholder="Message subject…"/>
    </div>
    <div style="margin-bottom:12px">
      <label style="font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:2px;color:var(--text2);display:block;margin-bottom:6px">MESSAGE</label>
      <textarea class="input-field w-full" id="nm-body" rows="3" placeholder="Type message…" style="resize:vertical;min-height:80px"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-sm btn-outline" onclick="closeModal('notif-modal')">CANCEL</button>
      <button class="btn-sm btn-info"    onclick="sendDirectNotif()">TRANSMIT</button>
    </div>
  </div>
</div>

<!-- ═══ TEAM TASK DETAIL ═══ -->
<div class="modal-overlay modal-wide" id="team-task-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('team-task-modal')">✕</button>
    <h3>⬡ Task detail</h3>
    <div id="team-task-body" class="team-task-scroll"></div>
  </div>
</div>

<div id="app"></div>

<script src="js/app.js"></script>
<script src="js/workspace.js"></script>
</body>
</html>
